<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="354" viewBox="0 0 1180 354" role="img" aria-labelledby="title desc">
<title id="title">EdgeGuard secure sensor network architecture</title><desc id="desc">Sensor nodes publish signed MQTT telemetry to Mosquitto, which forwards it to the Edge Gateway. Gateway stores in SQLite and exposes dashboard via FastAPI. Signed acknowledgements return to nodes.</desc>
