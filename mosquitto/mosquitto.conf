# Demo listener: external access is restricted to 127.0.0.1 by docker-compose.
# Set up TLS for access across an untrusted network.
listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/auth/passwords
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
